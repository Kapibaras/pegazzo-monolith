name: Release to Production

on:
  release:
    types: [published]

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish to Production
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Log in to private registry
        run: echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login "${{ secrets.REGISTRY_URL }}" -u "${{ secrets.REGISTRY_USER }}" --password-stdin

      - name: Retag and push image
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          IMAGE="${{ secrets.REGISTRY_URL }}/pegazzo-monolith"
          docker pull "$IMAGE:main"
          docker tag "$IMAGE:main" "$IMAGE:$TAG"
          docker tag "$IMAGE:main" "$IMAGE:latest"
          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:latest"

      - name: Deploy to production via Dokploy webhook
        run: curl -fsSL -X POST "${{ secrets.DOKPLOY_MONOLITH_PRODUCTION_WEBHOOK }}"

      - name: Print deployed URL
        run: |
          echo "✅ SUCCESS — Monolith released to production"
          echo "   URL: https://api.pegazzoauto.com"
