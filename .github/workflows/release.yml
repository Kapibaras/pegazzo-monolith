name: Release to Production

on:
  release:
    types: [published]

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  check-migrations:
    name: Check Pending Migrations
    runs-on: self-hosted
    environment: production
    steps:
      - name: Verify no pending migrations in production
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REGISTRY_URL: ${{ secrets.REGISTRY_URL }}
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          IMAGE="$REGISTRY_URL/pegazzo-monolith:main"
          echo "$REGISTRY_PASSWORD" | docker login "$REGISTRY_URL" -u "$REGISTRY_USER" --password-stdin
          docker pull "$IMAGE"
          docker run --rm \
            --network dokploy-network \
            -e DATABASE_URL="$DATABASE_URL" \
            "$IMAGE" \
            alembic check

  release:
    name: Publish to Production
    runs-on: self-hosted
    needs: check-migrations
    environment: production
    steps:
      - name: Retag and push image to registry
        env:
          REGISTRY_URL: ${{ secrets.REGISTRY_URL }}
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          IMAGE="$REGISTRY_URL/pegazzo-monolith"
          echo "$REGISTRY_PASSWORD" | docker login "$REGISTRY_URL" -u "$REGISTRY_USER" --password-stdin
          docker pull "$IMAGE:main"
          docker tag "$IMAGE:main" "$IMAGE:$TAG"
          docker tag "$IMAGE:main" "$IMAGE:latest"
          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:latest"

      - name: Deploy to production via Dokploy webhook
        env:
          WEBHOOK_URL: ${{ secrets.DOKPLOY_MONOLITH_PRODUCTION_WEBHOOK }}
        run: |
          curl -fsSL -X POST "$WEBHOOK_URL"

      - name: Print deployed URL
        run: |
          echo "SUCCESS — Monolith released to production"
          echo "   URL: https://api.pegazzoauto.com"
