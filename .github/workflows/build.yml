name: Build & Deploy Staging

on:
  push:
    branches:
      - main

concurrency:
  group: build-staging
  cancel-in-progress: false

jobs:
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to private registry
        run: echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login "${{ secrets.REGISTRY_URL }}" -u "${{ secrets.REGISTRY_USER }}" --password-stdin

      - name: Preserve previous image for rollback
        run: |
          IMAGE="${{ secrets.REGISTRY_URL }}/pegazzo-monolith"
          docker pull "$IMAGE:main" || true
          docker tag "$IMAGE:main" "$IMAGE:previous" 2>/dev/null || true
          docker push "$IMAGE:previous" || true

      - name: Build and push image
        run: |
          IMAGE="${{ secrets.REGISTRY_URL }}/pegazzo-monolith"
          docker build -t "$IMAGE:main" .
          docker push "$IMAGE:main"

  migrate-staging:
    name: Migrate Staging DB
    runs-on: ubuntu-latest
    needs: build
    environment: staging
    continue-on-error: true

    steps:
      - name: Run alembic migrations via SSH (fallback)
        uses: appleboy/ssh-action@v1.2.5
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REGISTRY_URL: ${{ secrets.REGISTRY_URL }}
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        with:
          host: ${{ secrets.KVM_HOST }}
          username: ${{ secrets.KVM_USER }}
          key: ${{ secrets.KVM_SSH_KEY }}
          envs: DATABASE_URL,REGISTRY_URL,REGISTRY_USER,REGISTRY_PASSWORD
          script: |
            IMAGE="$REGISTRY_URL/pegazzo-monolith:main"
            echo "$REGISTRY_PASSWORD" | docker login "$REGISTRY_URL" -u "$REGISTRY_USER" --password-stdin
            docker pull "$IMAGE"
            docker run --rm \
              --network dokploy-network \
              -e DATABASE_URL="$DATABASE_URL" \
              "$IMAGE" \
              alembic upgrade head

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: migrate-staging
    if: always() && needs.build.result == 'success'
    environment: staging

    steps:
      - name: Trigger Dokploy staging webhook
        run: curl -fsSL -X POST "${{ secrets.DOKPLOY_MONOLITH_STAGING_WEBHOOK }}"

      - name: Print deployed URL
        run: |
          echo "✅ SUCCESS — Monolith deployed to staging"
          echo "   URL: https://staging.api.pegazzoauto.com"
          echo "   Note: Migrations also run automatically on container startup via entrypoint.sh"
