name: Build & Deploy Staging

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to container registry
        env:
          REGISTRY_URL: ${{ secrets.REGISTRY_URL }}
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          echo "$REGISTRY_PASSWORD" | docker login "$REGISTRY_URL" \
            -u "$REGISTRY_USER" --password-stdin

      - name: Preserve previous image for rollback
        env:
          REGISTRY_URL: ${{ secrets.REGISTRY_URL }}
        run: |
          IMAGE="$REGISTRY_URL/pegazzo-monolith"
          docker pull "$IMAGE:main" || true
          docker tag "$IMAGE:main" "$IMAGE:previous" || true
          docker push "$IMAGE:previous" || true

      - name: Build and push Docker image
        env:
          REGISTRY_URL: ${{ secrets.REGISTRY_URL }}
        run: |
          IMAGE="$REGISTRY_URL/pegazzo-monolith:main"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

  migrate-staging:
    name: Migrate Staging DB
    runs-on: ubuntu-latest
    needs: build
    environment: staging

    steps:
      - name: Run alembic migrations via SSH
        uses: appleboy/ssh-action@v1
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REGISTRY_URL: ${{ secrets.REGISTRY_URL }}
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        with:
          host: ${{ secrets.KVM_HOST }}
          username: ${{ secrets.KVM_USER }}
          key: ${{ secrets.KVM_SSH_KEY }}
          envs: DATABASE_URL,REGISTRY_URL,REGISTRY_USER,REGISTRY_PASSWORD
          script: |
            IMAGE="$REGISTRY_URL/pegazzo-monolith:main"
            echo "$REGISTRY_PASSWORD" | docker login "$REGISTRY_URL" -u "$REGISTRY_USER" --password-stdin
            docker pull "$IMAGE"
            docker run --rm \
              -e DATABASE_URL="$DATABASE_URL" \
              "$IMAGE" \
              alembic upgrade head

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: migrate-staging

    steps:
      - name: Trigger Dokploy staging webhook
        env:
          WEBHOOK_URL: ${{ secrets.DOKPLOY_MONOLITH_STAGING_WEBHOOK }}
        run: |
          curl -fsSL -X POST "$WEBHOOK_URL"
