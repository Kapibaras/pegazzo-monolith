name: Build & Deploy Staging

on:
  push:
    branches:
      - main

concurrency:
  group: build-staging
  cancel-in-progress: false

jobs:
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest

    steps:
      - name: Build and push image on server
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2  # v1.2.5
        env:
          REGISTRY_URL: ${{ secrets.REGISTRY_URL }}
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.KVM_HOST }}
          username: ${{ secrets.KVM_USER }}
          key: ${{ secrets.KVM_SSH_KEY }}
          envs: REGISTRY_URL,REGISTRY_USER,REGISTRY_PASSWORD,GH_TOKEN
          command_timeout: 30m
          script: |
            IMAGE="$REGISTRY_URL/pegazzo-monolith"
            echo "$REGISTRY_PASSWORD" | docker login "$REGISTRY_URL" -u "$REGISTRY_USER" --password-stdin

            # Preserve previous image for rollback
            docker pull "$IMAGE:main" || true
            docker tag "$IMAGE:main" "$IMAGE:previous" 2>/dev/null || true
            docker push "$IMAGE:previous" || true

            # Clone repo and build
            rm -rf /tmp/pegazzo-build
            git clone https://x-access-token:$GH_TOKEN@github.com/Kapibaras/pegazzo-monolith.git /tmp/pegazzo-build
            cd /tmp/pegazzo-build
            docker build -t "$IMAGE:main" .
            docker push "$IMAGE:main"
            rm -rf /tmp/pegazzo-build

  migrate-staging:
    name: Migrate Staging DB
    runs-on: ubuntu-latest
    needs: build
    environment: staging

    steps:
      - name: Run alembic migrations via SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2  # v1.2.5
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REGISTRY_URL: ${{ secrets.REGISTRY_URL }}
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        with:
          host: ${{ secrets.KVM_HOST }}
          username: ${{ secrets.KVM_USER }}
          key: ${{ secrets.KVM_SSH_KEY }}
          envs: DATABASE_URL,REGISTRY_URL,REGISTRY_USER,REGISTRY_PASSWORD
          script: |
            IMAGE="$REGISTRY_URL/pegazzo-monolith:main"
            echo "$REGISTRY_PASSWORD" | docker login "$REGISTRY_URL" -u "$REGISTRY_USER" --password-stdin
            docker pull "$IMAGE"
            docker run --rm \
              --network dokploy-network \
              -e DATABASE_URL="$DATABASE_URL" \
              "$IMAGE" \
              alembic upgrade head

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: migrate-staging

    steps:
      - name: Trigger Dokploy staging webhook
        env:
          WEBHOOK_URL: ${{ secrets.DOKPLOY_MONOLITH_STAGING_WEBHOOK }}
        run: |
          curl -fsSL -X POST "$WEBHOOK_URL"
