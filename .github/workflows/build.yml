name: Build & Deploy Staging

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to container registry
        run: |
          echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login "${{ secrets.REGISTRY_URL }}" \
            -u "${{ secrets.REGISTRY_USER }}" --password-stdin

      - name: Build and push Docker image
        run: |
          IMAGE="${{ secrets.REGISTRY_URL }}/pegazzo-monolith:main"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Trigger Dokploy staging webhook
        run: |
          curl -fsSL -X POST "${{ secrets.DOKPLOY_MONOLITH_STAGING_WEBHOOK }}"

  migrate-staging:
    name: Migrate Staging DB
    runs-on: ubuntu-latest
    needs: deploy-staging

    steps:
      - name: Run alembic migrations via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.KVM_HOST }}
          username: ${{ secrets.KVM_USER }}
          key: ${{ secrets.KVM_SSH_KEY }}
          script: |
            docker exec $(docker ps -qf "name=pegazzo-monolith-staging") \
              alembic upgrade head
