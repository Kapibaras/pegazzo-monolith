name: Build & Deploy Staging

on:
  push:
    branches:
      - main

concurrency:
  group: build-staging
  cancel-in-progress: false

jobs:
  build:
    name: Build & Push Image
    runs-on: self-hosted

    steps:
      - name: Build and push image
        env:
          REGISTRY_URL: ${{ secrets.REGISTRY_URL }}
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IMAGE="$REGISTRY_URL/pegazzo-monolith"
          echo "$REGISTRY_PASSWORD" | docker login "$REGISTRY_URL" -u "$REGISTRY_USER" --password-stdin

          # Preserve previous image for rollback
          docker pull "$IMAGE:main" || true
          docker tag "$IMAGE:main" "$IMAGE:previous" 2>/dev/null || true
          docker push "$IMAGE:previous" || true

          # Clone repo and build
          rm -rf /tmp/pegazzo-build
          git clone https://x-access-token:$GH_TOKEN@github.com/Kapibaras/pegazzo-monolith.git /tmp/pegazzo-build
          cd /tmp/pegazzo-build
          docker build -t "$IMAGE:main" .
          docker push "$IMAGE:main"
          rm -rf /tmp/pegazzo-build

  migrate-staging:
    name: Migrate Staging DB
    runs-on: self-hosted
    needs: build
    environment: staging

    steps:
      - name: Run alembic migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REGISTRY_URL: ${{ secrets.REGISTRY_URL }}
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          IMAGE="$REGISTRY_URL/pegazzo-monolith:main"
          echo "$REGISTRY_PASSWORD" | docker login "$REGISTRY_URL" -u "$REGISTRY_USER" --password-stdin
          docker pull "$IMAGE"
          docker run --rm \
            --network dokploy-network \
            -e DATABASE_URL="$DATABASE_URL" \
            "$IMAGE" \
            alembic upgrade head

  deploy-staging:
    name: Deploy to Staging
    runs-on: self-hosted
    needs: migrate-staging

    steps:
      - name: Trigger Dokploy staging webhook
        env:
          WEBHOOK_URL: ${{ secrets.DOKPLOY_MONOLITH_STAGING_WEBHOOK }}
        run: |
          LOCAL_URL=$(echo "$WEBHOOK_URL" | sed 's|https://dokploy\.pegazzoauto\.com|http://localhost:3000|')
          curl -fsSL -X POST "$LOCAL_URL"

      - name: Print deployed URL
        run: |
          echo "SUCCESS — Monolith deployed to staging"
          echo "   URL: https://staging.api.pegazzoauto.com"
