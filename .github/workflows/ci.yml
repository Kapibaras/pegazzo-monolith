name: CI

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Set up environment
        uses: ./.github/actions/setup-env

      - name: Run ruff
        run: pipenv run ruff check .
        env:
          ENVIRONMENT: LOCAL

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Set up environment
        uses: ./.github/actions/setup-env

      - name: Run unit tests
        run: pipenv run pytest tests/unit/ --cov=app --cov-fail-under=80
        env:
          ENVIRONMENT: LOCAL
          DATABASE_URL: sqlite:///./test.db

