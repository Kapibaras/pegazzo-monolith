name: 'Setup Python Environment'
description: 'Setup Python 3.12, install pipenv and project dependencies'

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install pipenv
      run: pip install pipenv
      shell: bash

    - name: Install dependencies
      run: pipenv install --dev --deploy --ignore-pipfile
      shell: bash
