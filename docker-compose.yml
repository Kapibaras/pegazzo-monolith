x-common-env: &common-env
  ENVIRONMENT: LOCAL
  DEBUG: "true"
  DATABASE_URL: postgresql+psycopg2://pegazzo:pegazzo@postgres:5432/pegazzo
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/1
  CELERY_TASK_ALWAYS_EAGER: "false"
  WORKER_STUCK_TASK_MINUTES: "10"
  JWT_SECRET_KEY: local_dev_secret
  R2_ACCOUNT_ID: ""
  R2_ACCESS_KEY_ID: ""
  R2_SECRET_ACCESS_KEY: ""
  R2_ENDPOINT: ""
  R2_DOCUMENTS_BUCKET: pegazzo-documents
  R2_IMAGES_BUCKET: pegazzo-images
  R2_PUBLIC_URL: ""

services:
  postgres:
    image: postgres:15
    container_name: pegazzo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pegazzo
      POSTGRES_USER: pegazzo
      POSTGRES_PASSWORD: pegazzo
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pegazzo"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pegazzo-redis
    restart: unless-stopped
    command: redis-server --maxmemory 128mb --maxmemory-policy noeviction
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    container_name: pegazzo-api
    restart: unless-stopped
    environment:
      <<: *common-env
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    container_name: pegazzo-worker
    restart: unless-stopped
    command: celery -A app.worker.celery_app worker --loglevel=INFO --concurrency=2 -Q documents
    environment:
      <<: *common-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build: .
    container_name: pegazzo-beat
    restart: unless-stopped
    command: celery -A app.worker.celery_app beat --loglevel=INFO
    environment:
      <<: *common-env
    depends_on:
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
